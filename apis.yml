aid: 8fit
name: 8fit
description: >-
  8fit is a consumer health and fitness application offering personalized home
  workout programs (HIIT, boxing, Pilates, yoga, and meditation), custom healthy
  meal and nutrition plans, and holistic wellness guidance built around
  sustainable habit-building rather than quick fixes. Founded in Berlin and
  surfaced in the API Evangelist network as a portfolio company of Creandum, 8fit
  reached more than 40 million downloads before being acquired by Withings
  (a Gilde Healthcare portfolio company) in February 2022. Withings announced the
  discontinuation of the standalone 8fit app effective June 26, 2026, folding its
  nutrition and activity content into the Withings app and Withings+ service. 8fit
  is a mobile/web consumer app and does not publish a public developer API; this
  profile captures its public web, security, and identity surface.
